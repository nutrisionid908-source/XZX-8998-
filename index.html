<section class="panel">
<div class="dim" id="progress">QUESTION 001 / 209</div>

<pre id="question">
17
03:17
01110100 01101000 01100101

THE FIRST ANSWER IS WRONG.

Decode the binary.
</pre>

<input id="answer" autocomplete="off" spellcheck="false">
<button onclick="check()">SUBMIT</button>
<p id="status"></p>
</section>

<script>
const questions = [
  {
    q: `17
03:17
01110100 01101000 01100101

Decode the binary.`,
    a: "the"
  },

  {
    q: `ARCHIVE 01

A = 17
B = 19

Which number is prime?`,
    a: "both"
  },

  {
    q: `03:17

03 + 17 = ?
17 - 03 = ?

The archive asks for the difference.`,
    a: "14"
  }

  // Nanti dilanjutkan sampai QUESTION 209
];

let current = 0;

function check(){
  const input = document
    .getElementById("answer")
    .value
    .trim()
    .toLowerCase();

  const status = document.getElementById("status");

  if(input === questions[current].a){
    status.textContent = "CORRECT.";
    status.className = "green";

    current++;

    if(current >= questions.length){
      document.getElementById("question").textContent =
        "ARCHIVE COMPLETE.\n\n209 QUESTIONS CLEARED.";
      document.getElementById("progress").textContent =
        "QUESTION 209 / 209";
      return;
    }

    document.getElementById("progress").textContent =
      `QUESTION ${String(current + 1).padStart(3,"0")} / 209`;

    document.getElementById("question").textContent =
      questions[current].q;

    document.getElementById("answer").value = "";
  }else{
    status.textContent = "INCORRECT.";
    status.className = "red";
  }
}
    </script>
