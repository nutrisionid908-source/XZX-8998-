<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XZX-8998</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: monospace;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .screen {
        text-align: center;
        width: 90%;
        max-width: 700px;
    }

    .numbers {
        font-size: 18px;
        line-height: 1.15;
        letter-spacing: 3px;
        opacity: 0.8;
        white-space: pre;
        text-shadow: 0 0 8px #fff;
    }

    .title {
        margin-top: 35px;
        font-size: 26px;
        letter-spacing: 10px;
    }

    .time {
        margin-top: 25px;
        font-size: 20px;
        letter-spacing: 5px;
    }

    .archive {
        margin-top: 15px;
        font-size: 13px;
        opacity: 0.5;
        letter-spacing: 4px;
    }

    button {
        margin-top: 45px;
        padding: 12px 35px;
        background: transparent;
        border: 1px solid white;
        color: white;
        font-family: monospace;
        cursor: pointer;
        letter-spacing: 3px;
    }

    button:hover {
        background: white;
        color: black;
    }

    #question,
    #book {
        display: none;
    }

    input {
        background: black;
        border: 1px solid white;
        color: white;
        padding: 12px;
        font-family: monospace;
        text-align: center;
        outline: none;
    }

    .submit {
        margin-top: 15px;
    }

    #status {
        margin-top: 20px;
        font-size: 13px;
        min-height: 20px;
        white-space: pre-line;
    }

    .book-title {
        font-size: 22px;
        letter-spacing: 8px;
        margin-bottom: 35px;
    }

    .book-page {
        font-size: 15px;
        line-height: 1.7;
        white-space: pre-line;
        min-height: 180px;
    }

    .page-number {
        margin-top: 25px;
        opacity: 0.5;
    }

    .book-button {
        margin-top: 30px;
    }
</style>
</head>

<body>

<div class="screen">

    <!-- INTRO -->
    <div id="intro">

        <div class="numbers">
8998 1730 4921 0387
7319 2048 6612 9174
5730 8891 2037 4418
        </div>

        <div class="title">
            XZX-8998
        </div>

        <div class="time">
            03:17
        </div>

        <div class="archive">
            THE NULL ARCHIVE
        </div>

        <button onclick="enterArchive()">
            ENTER ARCHIVE
        </button>

    </div>


    <!-- QUESTION SYSTEM -->
    <section id="question">

        <div id="progress">
            QUESTION 001 / 209
        </div>

        <pre id="questionText"></pre>

        <input
            id="answer"
            autocomplete="off"
            spellcheck="false"
        >

        <br>

        <button class="submit" onclick="check()">
            SUBMIT
        </button>

        <p id="status"></p>

    </section>


    <!-- ARCHIVE BOOK -->
    <section id="book">

        <div class="book-title">
            THE ARCHIVE BOOK
        </div>

        <div id="bookPage" class="book-page"></div>

        <div class="page-number" id="pageNumber">
            PAGE XVII
        </div>

        <button
            class="book-button"
            onclick="nextPage()"
        >
            TURN PAGE
        </button>

    </section>

</div>


<script>

/* =========================
   QUESTIONS
========================= */

const questions = [

    {
        q: `17
03:17
01110100 01101000 01100101

THE FIRST ANSWER IS WRONG.

Decode the binary.`,
        a: "the"
    },

    {
        q: `ARCHIVE 01

A = 17
B = 19

Which number is prime?`,
        a: "both"
    },

    {
        q: `03:17

03 + 17 = ?
17 - 03 = ?

The archive asks for the difference.`,
        a: "14"
    },

    {
        q: `ARCHIVE 04

8998

Reverse the number.`,
        a: "8998"
    },

    {
        q: `ARCHIVE 05

17 → 03 → 17

What number appears twice?`,
        a: "17"
    },

    {
        q: `ARCHIVE 06

01111000 01111010 01111000

Decode.`,
        a: "xzx"
    },

    {
        q: `ARCHIVE 07

The archive contains
209 questions.

What is the last question?`,
        a: "209"
    },

    {
        q: `ARCHIVE 08

8998 - 8997 = ?`,
        a: "1"
    },

    {
        q: `ARCHIVE 09

03:17

Read it as numbers.

03
17

What is their sum?`,
        a: "20"
    },

    {
        q: `ARCHIVE 10

THE FIRST ANSWER WAS CORRECT.

But the archive says otherwise.

Type:

WRONG`,
        a: "wrong"
    }

];


/* =========================
   BOOK PAGES
========================= */

const pages = [

`THE ARCHIVE HAS NO BEGINNING.`,

`THE FIRST PAGE WAS REMOVED.

THE LAST PAGE HAS NOT BEEN WRITTEN.`,

`03:17

8998

THE NUMBERS ARE NOT RANDOM.`,

`СИСТЕМА: НЕИЗВЕСТНО

LOOK AGAIN.`,

`17 → 03 → 17

DO NOT TRUST THE ORDER.`,

`01110100 01101000 01100101

WHY IS THE ARCHIVE STILL LOCKED?`,

`YOU FOUND THE BOOK.

THE BOOK FOUND YOU.

NOW FORGET PAGE XXI.`

];


let currentQuestion = 0;
let currentPage = 0;


/* =========================
   ENTER ARCHIVE
========================= */

function enterArchive() {

    document.getElementById("intro").style.display = "none";

    document.getElementById("question").style.display = "block";

    loadQuestion();

}


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        `QUESTION ${String(currentQuestion + 1).padStart(3, "0")} / 209`;

    document.getElementById("questionText").innerText =
        q.q;

    document.getElementById("answer").value = "";

    document.getElementById("status").innerText = "";

}


/* =========================
   RANDOM COORDINATE
========================= */

function randomCoordinate() {

    /*
       Fictional X/Y coordinate.
       Bukan koordinat dunia nyata.
    */

    const x =
        (Math.random() * 200 - 100).toFixed(4);

    const y =
        (Math.random() * 200 - 100).toFixed(4);

    return `X: ${x}
Y: ${y}`;

}


/* =========================
   CHECK ANSWER
========================= */

function check() {

    const input =
        document.getElementById("answer")
        .value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById("status");


    if (input === questions[currentQuestion].a) {

        status.innerText =
`ANSWER ACCEPTED.

ARCHIVE FRAGMENT UNLOCKED.

COORDINATE:

${randomCoordinate()}`;


        currentQuestion++;


        /*
           Tunggu sebentar sebelum pindah
           ke pertanyaan berikutnya.
        */

        setTimeout(() => {

            if (currentQuestion >= questions.length) {

                openBook();

            } else {

                loadQuestion();

            }

        }, 2500);


    } else {

        status.innerText =
`ANSWER REJECTED.

THE ARCHIVE REMEMBERS YOUR MISTAKE.`;


    }

}


/* =========================
   OPEN BOOK
========================= */

function openBook() {

    document.getElementById("question").style.display =
        "none";

    document.getElementById("book").style.display =
        "block";

    currentPage = 0;

    showPage();

}


/* =========================
   SHOW PAGE
========================= */

function showPage() {

    document.getElementById("bookPage").innerText =
        pages[currentPage];

    document.getElementById("pageNumber").innerText =
        `PAGE ${String(currentPage + 17).padStart(3, "0")}`;

}


/* =========================
   NEXT PAGE
========================= */

function nextPage() {

    currentPage++;

    if (currentPage >= pages.length) {

        document.getElementById("bookPage").innerText =
`CONGRATULATIONS.

YOU FOUND THE ARCHIVE.

BUT THIS WAS ONLY
THE FIRST LAYER.

@+#(@)#/@?(@+#+-+-_+>`;

        document.getElementById("pageNumber").innerText =
            "ARCHIVE CLOSED";

        return;

    }

    showPage();

}

</script>

</body>
</html>
